<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tadoku Reader — N5 Library</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#6c8b6b" />

    <!-- Shared design system (copied from n5-study-app) -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Page-specific -->
    <link rel="stylesheet" href="css/tadoku.css" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="images/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="tadoku-container">
      <!-- ─── Header ─────────────────────────────────────────── -->
      <header class="tadoku-header">
        <div class="header-left">
          <h1>📚 Tadoku Reader</h1>
          <span class="header-sub">N5 Reading Library</span>
        </div>
        <div class="header-right">
          <a
            href="https://acg-applications.github.io/n5-study-app/"
            class="back-btn"
            >← Back to Study App</a
          >
        </div>
      </header>

      <!-- ─── Controls: level filter + search ────────────────── -->
      <div class="tadoku-controls">
        <div class="level-tabs" id="levelTabs">
          <button class="level-tab active" data-level="all">All</button>
          <button class="level-tab" data-level="0">L0</button>
          <button class="level-tab" data-level="1">L1</button>
          <button class="level-tab" data-level="2">L2</button>
          <button class="level-tab" data-level="3">L3</button>
          <button class="level-tab" data-level="4">L4</button>
          <button class="level-tab" data-level="5">L5</button>
        </div>
        <div class="search-wrap">
          <input
            type="search"
            id="searchInput"
            placeholder="🔍 Search titles…"
            autocomplete="off"
          />
        </div>
      </div>

      <!-- ─── Status line ────────────────────────────────────── -->
      <p class="tadoku-status" id="statusLine">Loading…</p>

      <!-- ─── Grid ───────────────────────────────────────────── -->
      <main class="reader-grid" id="readerGrid"></main>

      <footer class="tadoku-footer">
        💡 Click a cover or <strong>▶ Watch</strong> to play the video ·
        <strong>📕 PDF</strong> opens the printable book.
        <br />
        Media files live in the
        <a
          href="https://github.com/ACG-Applications/n5-study-app"
          target="_blank"
          rel="noopener noreferrer"
          >n5-study-app</a
        >
        repo.
      </footer>
    </div>

    <!-- Data first, then app -->
    <script src="js/data/readers.js"></script>
    <script src="js/app.js"></script>
    <script src="js/data/readers.js"></script>
    <script src="js/app.js"></script>

    <!-- Register Service Worker for PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").then(
            (registration) => {
              console.log("SW registered:", registration.scope);
            },
            (err) => {
              console.log("SW registration failed:", err);
            },
          );
        });
      }
    </script>
  </body>
</html>
